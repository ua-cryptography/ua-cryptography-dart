name: ua_cryptography
description: >-
  Ukrainian e-signatures for Dart and Flutter: sign and verify CAdES, XAdES and ASiC with DSTU 4145 keys from JKS key
  stores, and DSTU 7564 (Kupyna) hashing, over a native library.
version: 0.1.0
repository: https://github.com/ua-cryptography/ua-cryptography-dart
issue_tracker: https://github.com/ua-cryptography/ua-cryptography-dart/issues
topics:
  - cryptography
  - ffi
  - signature

environment:
  sdk: ^3.10.0

platforms:
  android:
  ios:
  linux:
  macos:
  windows:

dependencies:
  code_assets: ">=1.2.1 <3.0.0"
  crypto: ^3.0.6
  ffi: ^2.2.0
  hooks: ">=2.0.2 <3.0.0"

dev_dependencies:
  ffigen: ^23.0.0
  lints: ^6.0.0
  test: ^1.31.0

