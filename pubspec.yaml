name: ua_cryptography
description: >-
  Ukrainian national cryptography for Dart and Flutter: DSTU 4145, DSTU 7564 (Kupyna), DSTU 7624 (Kalyna),
  GOST 28147-89, GOST 34.311-95, key stores and CAdES / XAdES / ASiC signatures, over a native library.
version: 0.1.0-dev
repository: https://github.com/ua-cryptography/ua-cryptography-dart
issue_tracker: https://github.com/ua-cryptography/ua-cryptography-dart/issues
topics:
  - cryptography
  - ffi
  - signature

environment:
  sdk: ^3.10.0

platforms:
  android:
  ios:
  linux:
  macos:
  windows:

dependencies:
  code_assets: ">=1.2.1 <3.0.0"
  crypto: ^3.0.6
  ffi: ^2.2.0
  hooks: ">=2.0.2 <3.0.0"

dev_dependencies:
  ffigen: ^23.0.0
  lints: ^6.0.0
  test: ^1.31.0

